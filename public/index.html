<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask Gemini</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Ask Gemini AI 🤖</h1>
    
    <div class="input-group">
      <input type="text" id="questionInput" placeholder="Ask anything...">
      <button id="submitBtn">Ask</button>
    </div>

    <div class="output-box" id="result">
      <span class="thinking">Your answer will appear here...</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
